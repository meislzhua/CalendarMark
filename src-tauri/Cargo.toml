[package]
name = "calendarmark"
version = "0.4.1"
description = "A calm, local-first calendar journal built with Tauri 2"
authors = ["meislzhua"]
license = "MIT"
repository = "https://github.com/meislzhua/CalendarMark"
edition = "2021"
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
futures = "0.3"
hmac = "0.12"
sha1 = "0.10"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
tokio = { version = "1", features = ["time"] }
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"

# Android：reqwest 0.13 的 `rustls` 特性默认用 rustls-platform-verifier 验证证书，
# 它在 Android 上需要先用 Application Context 走 JNI 初始化并打包配套 Kotlin 组件，
# Tauri 生成的工程里没有这些，未初始化时所有 HTTPS 握手都会直接失败。
# 这里补上 rustls / webpki-roots，让 notion.rs 可以改用内置 Mozilla 根证书。
[target.'cfg(target_os = "android")'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
webpki-roots = "1"
