name: Package CalendarMark

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            artifact: windows
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            artifact: macos-arm64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            artifact: macos-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.args != '' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.args }}
      - name: Install dependencies
        run: npm ci
      - name: Build Tauri desktop package
        uses: tauri-apps/tauri-action@v0.5.24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: CalendarMark-${{ matrix.artifact }}
          path: src-tauri/target/**/release/bundle/**
          if-no-files-found: error

  android:
    name: Android / APK + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      - name: Configure runner Android SDK
        shell: bash
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "$SDK_PATH/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_PATH/platform-tools" >> "$GITHUB_PATH"
          if [ -x "$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "SDKMANAGER=$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_ENV"
          else
            echo "SDKMANAGER=$(command -v sdkmanager)" >> "$GITHUB_ENV"
          fi
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Configure Android NDK
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install dependencies
        run: npm ci
      - name: Initialize Android project
        run: npx tauri android init --ci --skip-targets-install
      - name: Build Android APKs
        shell: bash
        run: |
          set -o pipefail
          npx tauri android build --ci --apk --split-per-abi --verbose 2>&1 | tee android-apk-build.log
      - name: Build Android AAB
        shell: bash
        run: |
          set -o pipefail
          npx tauri android build --ci --aab --verbose 2>&1 | tee android-aab-build.log
      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: CalendarMark-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
      - name: Upload Android build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CalendarMark-android-build-logs
          path: '*-build.log'
