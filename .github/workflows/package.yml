name: Package CalendarMark

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop / ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
            artifact: windows
            bundles: |-
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            artifact: macos-arm64
            bundles: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            artifact: macos-x64
            bundles: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: ubuntu-22.04
            args: ''
            artifact: linux
            bundles: |-
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.args != '' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}-${{ matrix.artifact }}
      - name: Install dependencies
        run: npm ci
      - name: Build Tauri desktop package
        uses: tauri-apps/tauri-action@v0.5.24
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CalendarMark-${{ matrix.artifact }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
      - name: Publish desktop packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.bundles }}
          fail_on_unmatched_files: true

  android:
    name: Android / APK + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Android 工程由 tauri android init 在构建时生成，
      # checkout 后仓库中没有 gradle 依赖文件，不能使用 setup-java 的 gradle 缓存，
      # 这里手动缓存 Gradle 的下载与构建缓存目录。
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gradle-${{ runner.os }}-
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      - name: Configure runner Android SDK
        shell: bash
        run: |
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"
          echo "$SDK_PATH/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_PATH/platform-tools" >> "$GITHUB_PATH"
          if [ -x "$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "SDKMANAGER=$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_ENV"
          else
            echo "SDKMANAGER=$(command -v sdkmanager)" >> "$GITHUB_ENV"
          fi
      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
      - name: Configure Android NDK
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install dependencies
        run: npm ci
      - name: Initialize Android project
        run: npx tauri android init --ci --skip-targets-install
      - name: Build Android APKs + AAB
        shell: bash
        run: |
          set -o pipefail
          npx tauri android build --ci --apk --aab --split-per-abi --verbose 2>&1 | tee android-build.log
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CalendarMark-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
      - name: Publish Android packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          fail_on_unmatched_files: true
      - name: Upload Android build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CalendarMark-android-build-logs
          path: '*android-build.log'
